<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dsh-startup-terra · 启动屏预览</title>

<!--
  本地预览页（不属于插件运行时，不会被打包进 dsh plugin 的 files 列表）。

  直接双击本文件用浏览器打开就能看完整播放序列，不需要装 DSH、不需要起服务：
    · 刷新页面 = 重播
    · Esc / 右上角 SKIP = 跳过
    · 点「确认登录」= 走音效 + 权限验证

  想试不同配置，改下面 window.__DSH_TERRA__ 里的值即可
  （theme: 'light'、speed: 2、sound: false、accent: '#ffd24a' 等）。
-->

<link rel="stylesheet" href="lib/splash.css">

<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #060809;
    overflow: hidden;
  }
</style>
</head>
<body>

<div id="dsh-terra-root" class="dt-root dt-boot"></div>

<script>
  /* 本地预览没有 Host 路由，官方徽记改用相对路径取 */
  window.__DSH_TERRA_ASSET_BASE__ = 'lib/assets/'

  /* SCHEMA:BEGIN 由 tools/sync-schema.mjs 从 lib/schema.js 生成，不要手改
     （mode 覆盖为 always，方便反复刷新预览） */
  window.__DSH_TERRA_VERSION__ = "1.1.0"
  window.__DSH_TERRA__ = {
    enabled: true,
    mode: "always",  /* always | session | daily */
    speed: 1,
    requireInteraction: true,
    allowSkip: true,
    identity: "林间鹤",
    identityId: "0001",
    accessLevel: "8",
    sound: true,
    soundVolume: 0.7,
    org: "RHODES ISLAND",
    terminal: "TERMINAL 01",
    footer: "TERRA OPERATIONAL COMMAND",
    theme: "dark",  /* dark | light */
    accent: "auto"  /* auto = 跟随主题；或 #rrggbb */
  }
  /* SCHEMA:END */
</script>

<script src="lib/splash.js"></script>

</body>
</html>
